<!doctype html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nurtura — Menstrual Health & Learning for Girls</title>
    <meta name="description" content="A private, friendly, and gentle menstrual health tracker and educational companion designed specifically for girls ages 10 to 16." />
    <!-- Google Fonts: Quicksand & Nunito -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-bloom-bg text-bloom-plum antialiased selection:bg-bloom-secondary selection:text-bloom-plum min-h-screen">
    <div id="root"></div>
    <script>
      if (window.location.protocol === 'file:') {
        window.addEventListener('DOMContentLoaded', function () {
          var el = document.getElementById('root');
          if (el) {
            el.innerHTML =
              '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#F5EFF8;padding:24px;font-family:system-ui,sans-serif;color:#342C40;">' +
              '<div style="max-width:520px;background:#ffffff;border:1px solid #D7C4E8;padding:36px;border-radius:24px;box-shadow:0 12px 36px rgba(120,78,130,0.1);text-align:center;">' +
              '<div style="font-size:42px;margin-bottom:12px;">🌙</div>' +
              '<h2 style="font-size:22px;font-weight:800;color:#342C40;margin:0 0 12px 0;">Nurtura requires its local server</h2>' +
              '<p style="font-size:14px;color:#765477;line-height:1.6;margin:0 0 20px 0;">Opening <code>index.html</code> directly cannot run React, Vite, or the backend database.</p>' +
              '<div style="background:#F5EFF8;padding:16px 20px;border-radius:14px;text-align:left;margin-bottom:20px;">' +
              '<p style="font-size:12px;font-weight:800;color:#784E82;text-transform:uppercase;margin:0 0 6px 0;">How to open:</p>' +
              '<p style="font-size:14px;color:#342C40;margin:0;">Double-click <strong>Start Nurtura.bat</strong> in the main project folder.</p>' +
              '</div>' +
              '<a href="http://localhost:5173" style="display:inline-block;background:#784E82;color:#fff;padding:10px 22px;border-radius:12px;text-decoration:none;font-weight:700;font-size:14px;">Open http://localhost:5173</a>' +
              '</div></div>';
          }
        });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
